name: Build THRILL KILL v1.6

on:
  workflow_dispatch:
  push:
    paths:
      - 'Thrill_Kill_Android_Project_v1_6.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install platform
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager no está disponible en el runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP="Thrill_Kill_Android_Project_v1_6.zip"
          if [ ! -f "$ZIP" ]; then
            echo "No se encontró $ZIP en la raíz del repositorio."
            ls -la
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project
          WRAPPER="$(find project -type f -name gradlew | head -n 1)"
          if [ -z "$WRAPPER" ]; then
            echo "El ZIP no contiene gradlew."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Download official PCSX-ReARMed core (ARM64)
        shell: bash
        run: |
          set -e
          CORE_URL="https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip"
          mkdir -p "$PROJECT_DIR/app/src/main/assets/cores"
          curl --fail --location --retry 3 "$CORE_URL" -o /tmp/pcsx-rearmed.zip
          unzip -o /tmp/pcsx-rearmed.zip -d /tmp/pcsx-rearmed-core
          CORE="$(find /tmp/pcsx-rearmed-core -type f -name 'pcsx_rearmed_libretro_android.so' | head -n 1)"
          if [ -z "$CORE" ]; then
            echo "El paquete oficial no contiene pcsx_rearmed_libretro_android.so"
            find /tmp/pcsx-rearmed-core -maxdepth 3 -type f
            exit 1
          fi
          cp "$CORE" "$PROJECT_DIR/app/src/main/assets/cores/pcsx_rearmed_libretro_android.so"
          test -s "$PROJECT_DIR/app/src/main/assets/cores/pcsx_rearmed_libretro_android.so"
          mkdir -p "$PROJECT_DIR/app/src/main/assets/licenses"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Swordfish90/LibretroDroid/0.13.2/LICENSE" -o "$PROJECT_DIR/app/src/main/assets/licenses/LibretroDroid-GPL-3.0.txt"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/libretro/pcsx_rearmed/master/COPYING" -o "$PROJECT_DIR/app/src/main/assets/licenses/PCSX-ReARMed-GPL-2.0.txt"
          echo "Núcleo integrado: $(du -h "$PROJECT_DIR/app/src/main/assets/cores/pcsx_rearmed_libretro_android.so" | cut -f1)"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THRILL-KILL-v1.6-ARM64
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
