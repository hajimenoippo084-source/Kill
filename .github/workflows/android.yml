
name: Construir APK Thrill Kill Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar proyecto
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 4. Preparar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Comprobar archivos
      - name: Comprobar proyecto
        run: |
          echo "Revisando proyecto..."
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "ERROR: No se encontró gradlew"
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi

          chmod +x gradlew

      # 6. Compilar APK
      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --stacktrace

      # 7. Comprobar APK
      - name: Comprobar APK
        run: |
          echo "Buscando APK..."

          find app/build/outputs/apk -type f -name "*.apk"

          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó el APK"
            exit 1
          fi

          echo "APK generado correctamente: $APK"

      # 8. Guardar APK
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: THRILL-KILL-ANDROID-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
