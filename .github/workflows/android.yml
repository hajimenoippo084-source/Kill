
name: Construir APK Thrill Kill

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Thrill Kill Android
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar proyecto Android
        id: project
        shell: bash
        run: |
          WRAPPER=$(find . -maxdepth 6 -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No se encontró gradlew"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Proyecto localizado en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Verificar Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK no está instalado"
            exit 1
          fi

          echo "SDK instalado:"
          ls "$ANDROID_HOME"

      - name: Preparar SDK 35
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager"
            exit 1
          fi

          echo "Usando: $SDKMANAGER"

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || \
             [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then

            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "platform-tools"
          else
            echo "SDK 35 y Build Tools 35 ya están instalados."
          fi

      - name: Dar permisos a Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x gradlew

      - name: Compilar APK Debug
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Comprobar APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó el APK"
            exit 1
          fi

          echo "APK generado: $APK"
          ls -lh "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: THRILL-KILL-ANDROID-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
